name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        shell: bash
        run: |
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "The ubuntu-latest runner did not provide its preinstalled Android SDK (ANDROID_HOME is unset)." >&2
            exit 1
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "The ubuntu-latest runner's preinstalled Android SDK does not provide sdkmanager on PATH." >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdkmanager --version
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < <(yes)
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: alarm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
