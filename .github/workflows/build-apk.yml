name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "The runner did not provide an existing Android SDK through ANDROID_HOME or ANDROID_SDK_ROOT." >&2
            exit 1
          fi
          SDK_ROOT="$(realpath "$SDK_ROOT")"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -f "$SDKMANAGER" ]]; then
            echo "No Android sdkmanager was found in the runner's existing SDK at $SDK_ROOT." >&2
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$(realpath "$SDKMANAGER")")"

          COMPILE_SDK="$(awk '$1 == "compileSdkVersion" && $2 == "=" { print $3; exit }' android/variables.gradle)"
          if [[ ! "$COMPILE_SDK" =~ ^[0-9]+$ ]]; then
            echo "Could not determine compileSdkVersion from android/variables.gradle." >&2
            exit 1
          fi
          BUILD_TOOLS_VERSION="${COMPILE_SDK}.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          sdkmanager --sdk_root="$SDK_ROOT" --version
          sdkmanager --sdk_root="$SDK_ROOT" --licenses < <(yes)
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: alarm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
